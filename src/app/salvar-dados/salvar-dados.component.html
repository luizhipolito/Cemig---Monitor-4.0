<ion-app>
  <div class="head">
    <ion-menu side="start" content-id="main-content">
      <ion-header>
        <ion-toolbar translucent>
          <ion-title>Menu</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-item>
            <ion-icon name="mail" slot="start"></ion-icon>
            <ion-label>Inbox</ion-label>
          </ion-item>

          <ion-item name="logout" slot="start" (click)="logoutUsuario()">
            <ion-icon name="log-out-outline"></ion-icon>
            <ion-label>Sair</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <div id="main-content">
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    </div>

    <div class="nomeCentro">ADB Móvel</div>

    <div class="logoCemig">
      <img
        style="width: 100%; margin-right: -60px"
        src="../../../assets/logo-cemig-2048.png"
        alt="logo"
      />
    </div>
  </div>
  <ion-content>
    <div class="boxData">
      <div class="dataConfirm">
        <ion-list lines="none" *ngFor="let element of dataToWriteOnPI">
          <ion-item-divider>
            {{ getRelativePath(element.relativePath) }}
            <ion-checkbox
              slot="end"
              [(ngModel)]="element.isToSave"
            ></ion-checkbox
          ></ion-item-divider>

          <ion-item> Data: {{ element.date }}</ion-item>

          <ion-item *ngFor="let value of element.value">
            {{ value.Name }}:
            {{
              value.Selected && value.Selected.Name
                ? value.Selected.Name
                : value.Selected
            }}</ion-item
          >
        </ion-list>
      </div>
    </div>
    <div class="btn">
      <div class="btn_back">
        <ion-icon
          class="iconBack"
          (click)="onBack()"
          name="arrow-back-outline"
        ></ion-icon>
      </div>
      <div class="checkConfirm">
        <ion-checkbox></ion-checkbox>
        <ion-label>Confirmado</ion-label>
        <ion-button (click)="saveOnPI()">Enviar</ion-button>
      </div>
    </div>
  </ion-content>
</ion-app>
