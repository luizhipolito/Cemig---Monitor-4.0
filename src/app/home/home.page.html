<ion-content>
  <div class="tudo">
    <div class="bkg-opacity h-100">
      <div class="seetings" (click)="goSettings()">
        <ion-icon slot="icon-only" name="settings-sharp"></ion-icon>
      </div>

      <div class="main">
        <div class="main_logo">
          <img src="assets/logoWhite.png" alt="Logo cemig" />
        </div>
        <div class="main_descricao">
          <p>{{nameHome}}</p>
        </div>
        <div class="main_btns">
          <button type="submit" (click)="goEntrar()">Entrar</button>
          <button type="submit" (click)="goSincronizar()">Sincronizar</button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
