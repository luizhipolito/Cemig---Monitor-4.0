<ion-app>
  <div class="app-entrada-manual-container">
    <div class="head">
      <ion-menu side="start" content-id="main-content">
        <ion-header>
          <ion-toolbar translucent>
            <ion-title>Menu</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-list>
            <ion-item>
              <ion-icon name="mail" slot="start"></ion-icon>
              <ion-label>Inbox</ion-label>
            </ion-item>

            <ion-item name="logout" slot="start" (click)="logoutUsuario()">
              <ion-icon name="log-out-outline"></ion-icon>
              <ion-label>Sair</ion-label>
            </ion-item>
          </ion-list>
        </ion-content>
      </ion-menu>
      <div id="main-content">
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </div>

      <div class="nomeCentro">ADB Móvel</div>

      <div class="logoCemig">
        <img
          style="width: 100%; margin-right: -60px"
          src="../../../assets/logo-cemig-2048.png"
          alt="logo"
        />
      </div>
    </div>

    <!-- rote and search -->

    <div class="route">
      <div class="routeSelect" *ngIf="navigation || pathNavigation">
        <span (click)="onClickId({ path: [] })">Início &#9654;</span>
        <span
          *ngFor="let nav of pathNavigation.path; let i = index"
          (click)="
            onClickId({ name: nav, path: pathNavigation.path.slice(0, i + 1) })
          "
        >
          {{ nav }} &#9654;
        </span>
      </div>

      <div class="search">
        <ion-icon name="search-outline"></ion-icon>
      </div>
    </div>

    <!-- box data -->
    <ion-content>
      <div
        class="boxData"
        [ngClass]="elements == null ? 'boxTotal' : 'boxShort'"
      >
        <div *ngIf="!navigation || navigation.length == 0" class="spinner">
          <ion-spinner name="bubbles"></ion-spinner>
        </div>

        <div *ngIf="elements != null">
          <ion-list w-50>
            <ion-item>
              <ion-label>Data da Leitura:</ion-label>
              <ion-datetime
                displayFormat="DD/MM/YYYY"
                value="data"
                display-timezone="utc"
                [(ngModel)]="dataAtual"
              >
              </ion-datetime>
              <ion-icon class="iconCalendar" name="calendar-outline"></ion-icon>
            </ion-item>

            <ion-item *ngIf="elements.firstSelection">
              <ion-label (click)="print()">
                {{ elements.firstSelection.Name }}:</ion-label
              >
              <ion-input
                *ngIf="elements.firstSelection.Type == 'Double'"
                type="number"
                [value]="elements.firstSelection.Selected"
              ></ion-input>

              <ion-select
                *ngIf="elements.firstSelection.Type == 'EnumerationValue'"
                class="select"
                (ionChange)="onSelect($event)"
                [(ngModel)]="elements.firstSelection.Selected"
                (click)="print()"
              >
                <ion-select-option
                  *ngFor="let valueSet of elements.firstSelection.valuesSets"
                  [value]="valueSet"
                >
                  {{ valueSet.Name }}</ion-select-option
                >
              </ion-select>
            </ion-item>
            <!-- <div
              *ngIf="
                elements.firstSection &&
                elements.firstSection.Selected &&
                elements.firstSection.Selected.Name != conditionFirstSelection
              "
            > -->
            <!-- <ion-item *ngFor="let escrita of elements.escrita">
              <ion-label> {{ escrita.Name }}:</ion-label>
              <ion-input
                *ngIf="escrita.Type == 'Double'"
                type="number"
                [value]="escrita.Selected"
              ></ion-input>

              <ion-select
                *ngIf="escrita.Type == 'EnumerationValue'"
                class="select"
                [value]="escrita.Selected"
              >
                <ion-select-option
                  *ngFor="let valueSet of escrita.valuesSets"
                  >{{ valueSet.Name }}</ion-select-option
                >
              </ion-select>
            </ion-item>

            <div *ngFor="let leitura of elements.leitura">
              <ion-item>
                <ion-label> {{ leitura.Name }}:</ion-label>

                <ion-label color="gray"> {{ leitura.ValueString }}</ion-label>
              </ion-item>
            </div>

            <div *ngFor="let leituraEscrita of elements.leituraEscrita">
              <ion-item>
                <ion-label position="floating">
                  {{ leituraEscrita.Name }}:</ion-label
                >
                <ion-input
                  type="number"
                  value="{{ leituraEscrita.ValueString }}"
                  >{{ keyboardValue }}
                </ion-input>
              </ion-item>
            </div> -->

            <!-- </div> -->

            <ion-item *ngFor="let element of elements.list">
              <div *ngIf="element.visible">
                <ion-label> {{ element.Name }}:</ion-label>
                <ion-input
                  *ngIf="element.Type == 'Double'"
                  type="number"
                  [value]="element.Selected"
                ></ion-input>

                <ion-select
                  *ngIf="element.Type == 'EnumerationValue'"
                  class="select"
                  [value]="element.Selected"
                >
                  <ion-select-option
                    *ngFor="let valueSet of element.valuesSets"
                    >{{ valueSet.Name }}</ion-select-option
                  >
                </ion-select>
              </div>
            </ion-item>
          </ion-list>
        </div>

        <div *ngFor="let app of navigation">
          <ion-list (click)="onClickId(app)">
            <div>
              {{ app.name }}
            </div>
          </ion-list>
        </div>
        <div *ngIf="elements != null" class="controlKeyboard">
          <div class="keyboard">
            <div *ngFor="let numGroup of numberGroups">
              <ion-button
                *ngFor="let num of numGroup"
                (click)="onButtonPress(num)"
                class="calc-button"
                >{{ num }}
              </ion-button>
            </div>
          </div>
          <div class="btns">
            <ion-button (click)="saveElement()">Salvar</ion-button>
            <ion-button (click)="goInserirComentario()"
              >Inserir Comentario</ion-button
            >
          </div>
        </div>
      </div>
    </ion-content>
  </div>
</ion-app>
