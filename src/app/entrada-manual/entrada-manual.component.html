<ion-app>
  <div class="app-entrada-manual-container">
    <div class="head">
      <ion-menu side="start" content-id="main-content">
        <ion-header>
          <ion-toolbar translucent>
            <ion-title>Menu</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-list>
            <ion-item>
              <ion-icon name="mail" slot="start"></ion-icon>
              <ion-label>Inbox</ion-label>
            </ion-item>

            <ion-item name="logout" slot="start" (click)="logoutUsuario()">
              <ion-icon name="log-out-outline"></ion-icon>
              <ion-label>Sair</ion-label>
            </ion-item>
          </ion-list>
        </ion-content>
      </ion-menu>
      <div id="main-content">
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </div>

      <div class="nomeCentro">ADB Móvel</div>

      <div class="logoCemig">
        <img style="width: 100%; margin-right: -60px" src="../../../assets/logo-cemig-2048.png" alt="logo" />
      </div>
    </div>

    <!-- rote and search -->

    <div class="route">
      <div class="routeSelect" *ngIf="navigation || pathNavigation">
        <span (click)="onClickId({ path: [] })">Início &#9654;</span>
        <span *ngFor="let nav of pathNavigation.path; let i = index" (click)="
            onClickId({ name: nav, path: pathNavigation.path.slice(0, i + 1) })
          ">
          {{ nav }} &#9654;
        </span>
      </div>

      <div class="search">
        <ion-icon name="search-outline"></ion-icon>
      </div>
    </div>

    <!-- box data -->
    <ion-content>
      <div class="boxData" [ngClass]="elements == null ? 'boxTotal' : 'boxShort'">
        <div *ngIf="!navigation || navigation.length == 0" class="spinner">
          <ion-spinner name="bubbles"></ion-spinner>
        </div>

        <div *ngIf="elements != null">

          <ion-list w-50>
            <ion-item>
              <ion-label>Data da Leitura:</ion-label>
              <ion-datetime displayFormat="DD/MM/YYYY" value="data" display-timezone="utc" [(ngModel)]="dataAtual">
              </ion-datetime>
              <ion-icon class="iconCalendar" name="calendar-outline"></ion-icon>
            </ion-item>
            <ion-item>
              <ion-label>Observação</ion-label>
              <ion-select class="select" [(ngModel)]="escrita">
                <ion-select-option *ngFor="let escrita of elements.escrita">{{escrita.Name}}</ion-select-option>
              </ion-select>
            </ion-item>
            <ion-item>
              <ion-label position="floating">dados</ion-label>
              <ion-input></ion-input>
            </ion-item>
            <ion-item *ngFor="let leitura of elements.leitura">
              <ion-item>
                <ion-label> {{ leitura.Name }}:</ion-label>
              </ion-item>
              <ion-item>
                <ion-label color="gray"> {{ leitura.ValueString }}</ion-label>
              </ion-item>
            </ion-item>

            <div *ngFor="let leituraEscrita of elements.leituraEscrita">
              <ion-item>
                <ion-label position="floating">
                  {{ leituraEscrita.Name }}:</ion-label>
                <ion-input type='number' value="{{leituraEscrita.ValueString}}"></ion-input>
              </ion-item>
            </div>
          </ion-list>

        </div>

        <div *ngFor="let app of navigation">
          <ion-list (click)="onClickId(app)">
            <div>
              {{ app.name }}
            </div>
          </ion-list>
        </div>
        <div *ngIf="elements != null" class="controlKeyboard">
          <div class="keyboard">
            <div *ngFor="let numGroup of numberGroups">
              <ion-button *ngFor="let num of numGroup" (click)="onButtonPress(num)" class="calc-button">{{num}}
              </ion-button>
            </div>
          </div>
          <div class="btns">
            <ion-button>Salvar</ion-button>
            <ion-button>Sincronizar</ion-button>
            <ion-button>Inserir Comentario</ion-button>
          </div>
        </div>
      </div>

    </ion-content>
  </div>
</ion-app>
