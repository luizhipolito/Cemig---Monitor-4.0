<ion-app>
  <ion-content>
    <div class="boxData">
      <div *ngIf="showProgressBar" class="p-t-8 p-b-8">
        <ion-progress-bar type="indeterminate"></ion-progress-bar>
      </div>
      <div class="flex h-min">
        <ion-item class="w-25">
          Data Inicial:
          <ion-datetime [max]="endDateForm.value ? endDateForm.value : undefined" [formControl]="startDateForm" class="p-t-14 p-l-4" displayFormat="DD/MM/YYYY" value="data" max="2030" display-timezone="utc"
            cancelText="Cancelar" doneText="Confirmar">
          </ion-datetime>
        </ion-item>
        <ion-item class="w-25">
          Data Final:
          <ion-datetime [min]="startDateForm.value ? startDateForm.value : undefined" [formControl]="endDateForm" class="p-t-14 p-l-4" displayFormat="DD/MM/YYYY" value="data" max="2030" display-timezone="utc"
            cancelText="Cancelar" doneText="Confirmar">
          </ion-datetime>
        </ion-item>
        <ion-item class="w-25">
          Usinas:
          <ion-select [formControl]="usinasForm" [multiple]="true">
            <ion-select-option *ngFor="let usina of usinas" [value]="usina">{{ usina }}</ion-select-option>
          </ion-select>
        </ion-item>
        <div  class="w-25 vertical-center p-l-16">
          <ion-button [disabled]="startDateForm.invalid || endDateForm.invalid"(click)="exportLeituras()">EXPORTAR LEITURAS</ion-button>
        </div>
      </div>

      <div style="width: 500px"id="div-tables">
          <head>
              <style>
                table {
                  font-family: arial, sans-serif;
                  border-collapse: collapse;
                  width: 100%;
                }
                td,
                th {
                  border: 0.5px solid #a4a4a4;
                  text-align: left;
                  padding: 8px;
                }
                tr:nth-child(even) {
                  background-color: #dddddd;
                }
                .filter-cls {
                  padding-left: 4px;
                  font-weight: normal;
                }
                .flex {
                  display: flex;
                }
                .f-bold {
                  font-weight: bold;
                }
                .f-green {
                  color: rgb(112, 173, 71);
                }
                .f-red {
                  color: rgb(255, 0, 0);;
                }
                .color-black {
                  color: black;
                }
                .fs-8 {
                  font-size: 8px;
                }
                .nowrap {
                  white-space: nowrap;
                }
                .p-x-8 {
                  padding-left: 8px;
                  padding-right: 8px;
                }
                .p-b-table {
                  padding-bottom: 27px;
                }
                .p-t-table {
                  padding-top: 8px;
                }
                .h-26px{
                  height: 26px;
                }
                .w-read {
                  padding-left: 14px;
                  padding-right: 14px;
                }
              </style>
            </head>
              <div *ngFor="let page of tableData; let i = index" [ngClass]="{'p-b-table': i != (tableData.length - 1), 'p-t-table': true, 'p-x-8': true, 'color-black' : true}">
                <table class="color-black fs-8 nowrap">
                  <tr>
                    <th>Instrumento</th>
                    <th>Data Prevista</th>
                    <th>Data Leitura</th>
                    <th>Fun</th>
                    <th>Obs</th>
                    <th class="w-read">Leitura 1</th>
                    <th class="w-read">Leitura 2</th>
                    <th class="w-read">Leitura 3</th>
                    <th class="w-read">Leitura 4</th>
                    <th class="w-read">Leitura 5</th>
                  </tr>
                  <tr class="h-26px" *ngFor="let instrument of page.instruments">
                    <td>{{ instrument }}</td>
                    <td>{{ instrument ? page.dateStr : "" }}</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="w-read"></td>
                    <td class="w-read"></td>
                    <td class="w-read"></td>
                    <td class="w-read"></td>
                    <td class="w-read"></td>
                  </tr>
              </table>
            </div>
      </div>
    </div>
    <div class="btn">
      <div class=" btn_back">
        <ion-icon class="iconBack" (click)="onBack()" name="arrow-back-outline"></ion-icon>
      </div>
    </div>
  </ion-content>
</ion-app>
