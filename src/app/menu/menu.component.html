<div class="head">
  <ion-menu side="start" content-id="main-content" [swipeGesture]="appMenuSwipeGesture"
    (ionDidOpen)="appMenuSwipeGesture = false" (ionDidClose)="appMenuSwipeGesture = true">
    <ion-header>
      <ion-toolbar translucent>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>

        <ion-item (click)="goInicio()">
          <ion-icon name="home-outline"></ion-icon>
          <ion-label class="p-l-8">Início</ion-label>
        </ion-item>

        <ion-item (click)="goSalvarDados()">
          <ion-icon name="navigate-outline"></ion-icon>
          <ion-label class="p-l-8">Enviar</ion-label>
        </ion-item>

        <ion-item (click)="goPageLogs()">
          <ion-icon name="layers-outline"></ion-icon>
          <ion-label class="p-l-8">Logs</ion-label>
        </ion-item>

        <ion-item *ngIf="isAdmin" (click)="goLogsLeitura()">
          <ion-icon name="checkmark-done-outline"></ion-icon>
          <ion-label class="p-l-8">Logs de Leituras</ion-label>
        </ion-item>

        <ion-item name="logout" slot="start" (click)="logoutUsuario()">
          <ion-icon name="log-out-outline"></ion-icon>
          <ion-label class="p-l-8">Sair</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <div id="main-content" class="menuHamb">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </div>

  <div class="nomeCentro">{{config ? config.NomeAppMenu : ''}}</div>

  <div class="logoCemig">
    <img style="width: 100%; margin-right: -60px" src="assets/logo-cemig-2048.png" alt="logo" />
  </div>
</div>
