<div class="boxData">
  <ion-icon (click)="dismissModal()" name="close-sharp"></ion-icon>
  <form #f="ngForm" (ngSubmit)="onSubmit(f)">
    <div>
      <fieldset class="coments">
        <legend>Comentário:</legend>
        <ion-textarea type="text" ngModel name="message" rows="15" cols="100"></ion-textarea>
      </fieldset>
    </div>
    <div class="btn">
      <ion-button type="submit" (click)="salvarComent()">Salvar</ion-button>
    </div>
  </form>
</div>
